name: NPU backend contracts
on:
  push:
    paths:
      - 'startlux_decision/**'
      - 'tests/test_npu_model.py'
      - 'requirements-npu.txt'
      - '.github/workflows/npu-contracts.yml'
  pull_request:
    paths:
      - 'startlux_decision/**'
      - 'tests/test_npu_model.py'
      - 'requirements-npu.txt'
      - '.github/workflows/npu-contracts.yml'
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p test_npu_model.py -v
